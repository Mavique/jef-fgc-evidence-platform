name: FGC staging deployment
on:
  workflow_dispatch:
    inputs:
      payload_sha:
        description: Exact authorised application payload commit
        required: true
        type: string
      validation_run_id:
        description: Successful two-SHA validation run
        required: true
        type: string
      artifact_id:
        description: Fresh validated staging artifact ID
        required: true
        type: string
      target_worker:
        description: Must be jef-fgc-staging
        required: true
        type: string
      expected_previous_version:
        description: Independently recorded current staging Worker version
        required: true
        type: string
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: fgc-staging-deployment
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy verified staging payload
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25
    env:
      PAYLOAD_SHA: ${{ inputs.payload_sha }}
      VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      TARGET_WORKER: ${{ inputs.target_worker }}
      EXPECTED_PREVIOUS_VERSION: ${{ inputs.expected_previous_version }}
    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: _control
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set separate payload directory
        run: echo "ARTIFACT_ROOT=$RUNNER_TEMP/fgc-payload" >> "$GITHUB_ENV"
      - name: Reject reruns and validate source metadata before download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          node _control/scripts/fgc/staging-control.mjs metadata
      - name: Verify credentials, previous version and readiness before download
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node _control/scripts/fgc/staging-control.mjs preflight
      - name: Download validated payload separately
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          run-id: ${{ inputs.validation_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fgc-payload
          merge-multiple: true
      - name: Verify payload manifest, checksums, paths and scope
        run: node _control/scripts/fgc/staging-control.mjs verify
      - name: Install locked controller tools without hooks
        working-directory: _control
        run: npm ci --ignore-scripts
      - name: Recheck all gates and deploy once
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node _control/scripts/fgc/deploy-staging.mjs
