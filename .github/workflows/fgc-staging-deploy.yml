name: FGC staging deployment

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact PR head commit validated by FGC validation
        required: true
        type: string
      run_id:
        description: Successful FGC validation run ID
        required: true
        type: string
      artifact_id:
        description: Artifact ID from that validation run
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: fgc-staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy verified staging artifact
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - name: Validate requested PR and run
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          if ! printf '%s' "$COMMIT_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo 'commit_sha must be 40 lowercase hexadecimal characters'
            exit 2
          fi
          if ! printf '%s' "$RUN_ID" | grep -Eq '^[0-9]+$' || ! printf '%s' "$ARTIFACT_ID" | grep -Eq '^[0-9]+$'; then
            echo 'run_id and artifact_id must be numeric'
            exit 2
          fi
          pr=$(gh api repos/$GITHUB_REPOSITORY/pulls/2)
          test "$(printf '%s' "$pr" | jq -r .base.ref)" = main
          test "$(printf '%s' "$pr" | jq -r .head.ref)" = fix/fgc-production-hardening
          test "$(printf '%s' "$pr" | jq -r .head.sha)" = "$COMMIT_SHA"
          test "$(printf '%s' "$pr" | jq -r .state)" = open
          run=$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID)
          test "$(printf '%s' "$run" | jq -r .head_sha)" = "$COMMIT_SHA"
          test "$(printf '%s' "$run" | jq -r .conclusion)" = success
          test "$(printf '%s' "$run" | jq -r .event)" = pull_request
          artifact=$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID)
          test "$(printf '%s' "$artifact" | jq -r .workflow_run.id)" = "$RUN_ID"
          test "$(printf '%s' "$artifact" | jq -r .name)" = "jef-fgc-staging-$COMMIT_SHA"
          test "$(printf '%s' "$artifact" | jq -r .expired)" = false
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$(printf '%s' "$artifact" | jq -r .name)" >> "$GITHUB_OUTPUT"
        id: gate

      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Test Cloudflare credential preflight classification
        run: |
          node - <<'NODE'
          const assert = require('assert');
          const classify = (verify, account, worker) => {
            if (verify === 401) return 'Cloudflare token invalid or expired.';
            if (verify === 403 || verify === 'inactive') return 'Cloudflare token inactive.';
            if (verify !== 200) return 'Unexpected Cloudflare API failure during token verification.';
            if (account === 403) return 'Cloudflare token is scoped to a different account.';
            if (account === 404) return 'Cloudflare account ID is inaccessible or incorrect.';
            if (account !== 200) return 'Unexpected Cloudflare API failure during account access.';
            if (worker === 403) return 'Cloudflare token lacks Workers Scripts access.';
            if (worker === 404) return 'Existing staging Worker was not found.';
            if (worker !== 200) return 'Unexpected Cloudflare API failure during Worker access.';
            return 'Cloudflare credential preflight passed.';
          };
          const cases = [[200, 200, 200, 'passed'], [401, 200, 200, 'invalid'], ['inactive', 200, 200, 'inactive'], [200, 403, 200, 'different account'], [200, 200, 403, 'Workers Scripts'], [200, 200, 404, 'not found'], [500, 200, 200, 'Unexpected']];
          for (const [verify, account, worker, expected] of cases) {
            const message = classify(verify, account, worker);
            assert(message.includes(expected));
            assert(!/[A-Z0-9]{32}|Bearer|token-value|secret-value|connection-string/i.test(message));
          }
          console.log('Cloudflare credential preflight fixtures passed.');
          NODE

      - name: Read-only Cloudflare credential preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '::add-mask::%s\n' "$CLOUDFLARE_ACCOUNT_ID"
          node - <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const base = 'https://api.cloudflare.com/client/v4';
          const fail = (message) => { console.error(message); process.exit(1); };
          if (!token) fail('Cloudflare API token is not configured.');
          if (!/^[a-f0-9]{32}$/i.test(accountId || '')) fail('Cloudflare account ID is inaccessible or incorrectly configured.');
          const request = async (url) => {
            try {
              const response = await fetch(url, { headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' } });
              let body = null; try { body = await response.json(); } catch {}
              return { status: response.status, body };
            } catch { return { status: 0, body: null }; }
          };
          (async () => {
            const verification = await request(`${base}/user/tokens/verify`);
            if (verification.status === 401) fail('Cloudflare token invalid or expired.');
            if (verification.status === 403) fail('Cloudflare token inactive or not permitted.');
            if (verification.status !== 200) fail('Unexpected Cloudflare API failure during token verification.');
            if (verification.body?.result?.status !== 'active') fail('Cloudflare token inactive.');
            const account = await request(`${base}/accounts/${accountId}`);
            if (account.status === 401) fail('Cloudflare token invalid or expired.');
            if (account.status === 403) fail('Cloudflare token is scoped to a different account.');
            if (account.status === 404) fail('Cloudflare account ID is inaccessible or incorrect.');
            if (account.status !== 200 || account.body?.success !== true) fail('Unexpected Cloudflare API failure during account access.');
            const worker = await request(`${base}/accounts/${accountId}/workers/services/jef-fgc-staging`);
            if (worker.status === 401) fail('Cloudflare token invalid or expired.');
            if (worker.status === 403) fail('Cloudflare token lacks Workers Scripts access.');
            if (worker.status === 404) fail('Existing staging Worker was not found.');
            if (worker.status !== 200 || worker.body?.success !== true) fail('Unexpected Cloudflare API failure during Worker access.');
            console.log('Cloudflare credential preflight passed: active token, account access and existing staging Worker verified.');
          })().catch(() => fail('Unexpected Cloudflare API failure during credential preflight.'));
          NODE
      - name: Download validated artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          run-id: ${{ inputs.run_id }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/fgc-ci-artifact
          github-token: ${{ github.token }}

      - name: Resolve downloaded artifact root
        id: resolve
        env:
          FGC_DOWNLOAD_ROOT: ${{ runner.temp }}/fgc-ci-artifact
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const os = require('os');
          const path = require('path');
          const base = fs.realpathSync(process.env.FGC_DOWNLOAD_ROOT);
          const within = (root, candidate) => candidate === root || candidate.startsWith(root + path.sep);
          const normalize = (root, candidate) => {
            const relative = path.relative(root, candidate);
            if (!relative || path.isAbsolute(relative) || relative.split(path.sep).some((part) => part === '..' || part === '.')) throw new Error('Unsafe artifact path');
            return relative;
          };
          const discover = (root) => {
            const candidates = [];
            const visit = (current, depth) => {
              for (const entry of fs.readdirSync(current, { withFileTypes: true })) {
                const full = path.join(current, entry.name);
                if (entry.isSymbolicLink()) throw new Error('Symlink in artifact wrapper');
                normalize(root, full);
                if (entry.isDirectory()) { if (depth < 1) visit(full, depth + 1); }
                else if (entry.isFile() && entry.name === 'manifest.json') candidates.push(full);
              }
            };
            visit(root, 0);
            if (candidates.length !== 1) throw new Error(candidates.length === 0 ? 'Artifact manifest not found at root or single wrapper depth' : 'Multiple artifact manifests found');
            const artifactRoot = fs.realpathSync(path.dirname(candidates[0]));
            if (!within(root, artifactRoot)) throw new Error('Artifact root escapes controlled directory');
            return artifactRoot;
          };
          const fixture = fs.mkdtempSync(path.join(os.tmpdir(), 'fgc-artifact-root-'));
          fs.mkdirSync(path.join(fixture, 'wrapper', 'server'), { recursive: true });
          fs.writeFileSync(path.join(fixture, 'wrapper', 'manifest.json'), '{}');
          if (!discover(fixture).endsWith(path.join('wrapper'))) throw new Error('Valid wrapper fixture failed');
          fs.writeFileSync(path.join(fixture, 'manifest.json'), '{}');
          try { discover(fixture); throw new Error('Ambiguous fixture accepted'); } catch (error) { if (!/Multiple artifact manifests/.test(error.message)) throw error; }
          fs.rmSync(path.join(fixture, 'manifest.json'), { force: true });
          try { normalize(fixture, path.join(fixture, '..', 'escape')); throw new Error('Traversal fixture accepted'); } catch (error) { if (!/Unsafe artifact path/.test(error.message)) throw error; }
          const outside = path.join(os.tmpdir(), 'fgc-artifact-root-outside-' + process.pid);
          fs.writeFileSync(outside, 'outside');
          fs.symlinkSync(outside, path.join(fixture, 'link'));
          try { discover(fixture); throw new Error('Symlink fixture accepted'); } catch (error) { if (!/Symlink in artifact wrapper/.test(error.message)) throw error; }
          fs.rmSync(fixture, { recursive: true, force: true });
          fs.rmSync(outside, { force: true });
          const artifactRoot = discover(base);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'artifact_root=' + artifactRoot + '\n');
          NODE
      - name: Verify artifact integrity and scope
        env:
          FGC_STAGING_ARTIFACT_DIR: ${{ steps.resolve.outputs.artifact_root }}
          FGC_SOURCE_COMMIT: ${{ inputs.commit_sha }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const root = process.env.FGC_STAGING_ARTIFACT_DIR;
          const normalize = (value) => {
            const normalized = value.replaceAll('\\', '/');
            if (!normalized || normalized.startsWith('/') || /^[A-Za-z]:\//.test(normalized) || normalized.split('/').some((part) => !part || part === '.' || part === '..')) throw new Error('Unsafe artifact path');
            return normalized;
          };
          const compare = (a, b) => normalize(a) < normalize(b) ? -1 : normalize(a) > normalize(b) ? 1 : 0;
          const inventory = (dir) => {
            const records = [];
            const seen = new Set();
            const visit = (current) => {
              for (const entry of fs.readdirSync(current, { withFileTypes: true })) {
                const full = path.join(current, entry.name);
                if (entry.isSymbolicLink()) throw new Error('Symlink in artifact');
                if (entry.isDirectory()) visit(full);
                else if (entry.isFile() && entry.name !== '.dev.vars') {
                  const relative = normalize(path.relative(dir, full));
                  if (seen.has(relative)) throw new Error('Duplicate artifact path');
                  seen.add(relative);
                  records.push({ path: relative, sha256: crypto.createHash('sha256').update(fs.readFileSync(full)).digest('hex') });
                }
              }
            };
            visit(dir);
            records.sort((a, b) => compare(a.path, b.path));
            return { count: records.length, sha256: crypto.createHash('sha256').update(JSON.stringify(records)).digest('hex') };
          };
          const manifest = JSON.parse(fs.readFileSync(path.join(root, 'manifest.json')));
          const config = JSON.parse(fs.readFileSync(path.join(root, 'server/wrangler.staging.json')));
          if (manifest.sourceCommit !== process.env.FGC_SOURCE_COMMIT) throw new Error('Artifact commit mismatch');
          if (manifest.workerName !== 'jef-fgc-staging' || config.name !== 'jef-fgc-staging') throw new Error('Unexpected Worker name');
          if (!config.hyperdrive?.some((binding) => binding.binding === 'HYPERDRIVE') || !config.kv_namespaces?.some((binding) => binding.binding === 'VINEXT_KV_CACHE')) throw new Error('Required staging binding missing');
          const server = inventory(path.join(root, 'server'));
          const client = inventory(path.join(root, 'client'));
          if (server.count !== manifest.server.count || server.sha256 !== manifest.server.sha256 || client.count !== manifest.client.count || client.sha256 !== manifest.client.sha256) throw new Error('Artifact inventory mismatch');
          const files = fs.readdirSync(root, { recursive: true }).map(String);
          if (files.some((file) => file.includes('.env') || file.includes('.dev.vars') || file.includes('.git') || file.includes('node_modules'))) throw new Error('Forbidden artifact file');
          if (JSON.stringify(config).match(/postgres(?:ql)?:\/\/|password|service[_-]?role|api[_-]?key|session[_-]?secret|bootstrap[_-]?token|production/i)) throw new Error('Forbidden artifact configuration');
          if (!fs.existsSync(path.resolve(root, 'server', config.main)) || !fs.existsSync(path.resolve(root, 'server', config.assets.directory))) throw new Error('Artifact entry or assets missing');
          NODE

      - name: Prepare guarded deployment runtime
        shell: bash
        run: |
          shim_dir="$RUNNER_TEMP/fgc-npx-shim"
          mkdir -p "$shim_dir"
          printf '%s\n' '#!/usr/bin/env bash' 'exec npx "$@"' > "$shim_dir/npx.cmd"
          chmod 700 "$shim_dir/npx.cmd"
          echo "$shim_dir" >> "$GITHUB_PATH"

      - name: Deploy only jef-fgc-staging
        env:
          FGC_ENVIRONMENT: staging
          FGC_STAGING_DEPLOY_CONFIRM: I_UNDERSTAND_STAGING_DEPLOY
          FGC_STAGING_ARTIFACT_DIR: ${{ steps.resolve.outputs.artifact_root }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/fgc/deploy-staging.mjs

      - name: Verify public staging routes
        env:
          STAGING_ORIGIN: https://jef-fgc-staging.victor-b5a.workers.dev
        run: |
          node - <<'NODE'
          const routes = ['/', '/fgc-ekm', '/health', '/health/ready', '/api/fgc/health', '/api/fgc/auth/me'];
          const denied = /appUrl|missingConfig|FGC_[A-Z0-9_]+|NEXT_PUBLIC_[A-Z0-9_]+|connection|string|database|storage|stack|exception|provider|secret|token/i;
          (async () => {
            for (const route of routes) {
              const response = await fetch(process.env.STAGING_ORIGIN + route);
              const body = await response.text();
              if (route === '/' || route === '/fgc-ekm' || route === '/health') { if (response.status !== 200) throw new Error(`${route} returned ${response.status}`); }
              if (route === '/health/ready' || route === '/api/fgc/health') { if (![200, 503].includes(response.status)) throw new Error(`${route} returned ${response.status}`); if (denied.test(body)) throw new Error(`${route} disclosed forbidden content`); }
              if (route === '/api/fgc/auth/me' && ![401, 403].includes(response.status)) throw new Error(`/api/fgc/auth/me returned ${response.status}`);
              console.log(`${route} ${response.status}`);
            }
          })().catch((error) => { console.error(error.message); process.exit(1); });
          NODE

      - name: Record deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deployments list --name jef-fgc-staging
