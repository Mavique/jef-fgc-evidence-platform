name: FGC validation

on:
  workflow_dispatch:
    inputs:
      payload_sha:
        description: Exact authorised application payload commit
        required: true
        type: string
  pull_request:
  push:
    branches:
      - main
      - production

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'workflow_dispatch'
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Controller/payload isolation fixtures
        run: node .github/scripts/fgc-controller-payload-test.mjs --test

      - name: Cloudflare credential preflight fixtures
        run: npm run test:fgc:preflight


      - name: Guarded recovery security fixtures
        run: node --test scripts/fgc/staging-control.test.mjs

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --run

      - name: Production build
        run: npm run build

      - name: Cloudflare compatibility scan
        run: npx vinext check

      - name: Migration files validation
        run: npm run test:db

      - name: Disposable PostgreSQL application integration
        run: npm run test:db:integration

      - name: Private evidence storage integration
        run: npm run test:fgc:evidence

  payload:
    name: Validate exact staging payload
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      PAYLOAD_SHA: ${{ inputs.payload_sha }}
      PAYLOAD_ROOT: ${{ github.workspace }}/_payload
      FGC_SOURCE_COMMIT: ${{ inputs.payload_sha }}
      FGC_CF_HYPERDRIVE_ID: ${{ vars.FGC_CF_HYPERDRIVE_ID }}
      FGC_CF_KV_NAMESPACE_ID: ${{ vars.FGC_CF_KV_NAMESPACE_ID }}
    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: _control
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set separate artifact directory
        run: |
          echo "ARTIFACT_ROOT=$RUNNER_TEMP/fgc-staging-artifact" >> "$GITHUB_ENV"
          echo "FGC_STAGING_ARTIFACT_ROOT=$RUNNER_TEMP/fgc-staging-artifact" >> "$GITHUB_ENV"
      - name: Verify controller, authorised payload and open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: node _control/scripts/fgc/staging-control.mjs build-start
      - name: Checkout exact payload detached
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.payload_sha }}
          path: _payload
          persist-credentials: false
      - name: Verify actual payload checkout
        run: node _control/scripts/fgc/staging-control.mjs checkout
      - name: Install build dependencies
        working-directory: _payload
        run: npm ci
      - name: Lint
        working-directory: _payload
        run: npm run lint
      - name: Type check
        working-directory: _payload
        run: npm run typecheck
      - name: Unit tests
        working-directory: _payload
        run: npm test -- --run
      - name: Production build
        working-directory: _payload
        run: npm run build
      - name: Cloudflare compatibility scan
        working-directory: _payload
        run: npx --no-install vinext check
      - name: Vinext build
        working-directory: _payload
        run: npm run build:vinext
      - name: Migration files validation
        working-directory: _payload
        run: npm run test:db
      - name: Disposable PostgreSQL application integration
        working-directory: _payload
        run: npm run test:db:integration
      - name: Private evidence storage integration
        working-directory: _payload
        run: npm run test:fgc:evidence
      - name: Prepare staging metadata
        run: node _control/scripts/fgc/staging-control.mjs prepare
      - name: Compose and check staging configuration
        working-directory: _payload
        run: |
          npm run cf:staging:prepare
          npm run cf:staging:check
      - name: Package generated payload output
        working-directory: _payload
        run: npm run cf:staging:package
      - name: Verify unchanged exact checkout and stamp two-SHA manifest
        run: node _control/scripts/fgc/staging-control.mjs stamp
      - name: Upload fresh validated staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: jef-fgc-staging-3676a7f92cd7acecd9da596151df860590901b7d
          path: ${{ runner.temp }}/fgc-staging-artifact
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
