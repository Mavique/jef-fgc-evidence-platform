name: FGC validation

on:
  pull_request:
  push:
    branches:
      - main
      - production

permissions:
  contents: read

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --run

      - name: Production build
        run: npm run build

      - name: Cloudflare compatibility scan
        run: npx vinext check

      - name: Migration files validation
        run: npm run test:db

      - name: Disposable PostgreSQL application integration
        run: npm run test:db:integration

      - name: Private evidence storage integration
        run: npm run test:fgc:evidence
